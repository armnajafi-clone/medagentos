[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "medagentos"
version = "0.1.0"
description = "An open-source medical AI workflow runtime: orchestration, artifacts, traceability, evaluation and human review."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "MedAgentOS contributors" }]
keywords = ["medical-ai", "workflow", "orchestration", "traceability", "mri", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Medical Science Apps.",
]

# The Core runtime deliberately has NO runtime dependencies.
# ADR-001/ADR-003: core stays domain independent and infrastructure free;
# everything that needs a third-party library is an optional extra behind an interface.
dependencies = []

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]
postgres = ["sqlalchemy>=2.0", "psycopg[binary]>=3.1", "alembic>=1.13"]
s3 = ["boto3>=1.34"]
vector = ["qdrant-client>=1.8"]
imaging = ["numpy>=1.26", "nibabel>=5.2", "monai>=1.3", "torch>=2.2"]
dev = ["pytest>=8.0", "pytest-cov>=4.1", "httpx>=0.27", "ruff>=0.3", "mypy>=1.9"]

[project.scripts]
medagentos = "medagentos.cli:main"

[project.urls]
Homepage = "https://github.com/armnajafi-clone/medagentos"
Documentation = "https://github.com/armnajafi-clone/medagentos/tree/main/docs"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
medagentos = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "plugins"]
addopts = "-q"
markers = [
  "requires_api: needs the optional [api] extra (fastapi) installed",
  "requires_imaging: needs the optional [imaging] extra installed",
]

[tool.ruff]
line-length = 100
src = ["src", "plugins", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
packages = ["medagentos"]
mypy_path = "src"
strict = true
warn_unreachable = true
